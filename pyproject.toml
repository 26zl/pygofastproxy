[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygofastproxy"
version = "1.1.1"
description = "A blazing-fast HTTP proxy for Python, powered by Go’s fasthttp library"
readme = "README.md"
authors = [{ name = "Laurent Zogaj" }]
license = "MIT"
requires-python = ">=3.10"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pygofastproxy"]
exclude = ["pygofastproxy.go"]

[tool.setuptools.package-data]
pygofastproxy = ["go/*.go", "go/go.mod", "go/go.sum"]

[project.optional-dependencies]
test = ["pytest>=7.0", "requests>=2.20"]

[project.scripts]
pygofastproxy = "pygofastproxy.__main__:main"

[project.urls]
Homepage = "https://github.com/26zl/pygofastproxy"
Repository = "https://github.com/26zl/pygofastproxy"
Issues = "https://github.com/26zl/pygofastproxy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]